name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

# https://help.github.com/en/actions/automating-your-workflow-with-github-actions/software-installed-on-github-hosted-runners

concurrency:
  # On master/release, we don't want any jobs cancelled so the sha is used to name the group
  # On PR branches, we cancel the job if new commits are pushed
  # More info: https://stackoverflow.com/a/68422069/253468
  group: ${{ (github.ref == 'refs/heads/branch_1.2.18' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release' ) && format('ci-main-{0}', github.sha) || format('ci-main-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Test:
    name: JDK ${{ matrix.jdk }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      matrix:
        jdk: [11, 17]
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: true
      max-parallel: 4
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 50
    - name: Set up Java ${{ matrix.jdk }}
      if: ${{ matrix.jdk != '8' }}
      uses: actions/setup-java@v2
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.jdk }}
    - name: Install
      # download dependencies, etc, so test log looks better
      shell: bash
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          mvn -B install -Dtest='${{ inputs.test-filter }}' -Dsurefire.failIfNoSpecifiedTests=false
        else
          mvn -B install
        fi
    - name: Surefire report
      shell: bash
      run: |
        PY="$(command -v python3 || command -v python)"
        "$PY" .github/scripts/surefire_report.py

  Build:
    name: Build jars (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@v3
    - name: Re-checkout text files with CRLF
      # the public jars carry CRLF copies of checked-in text resources (pom.xml, *.sql,
      # services files) but LF in Maven-generated files (INDEX.LIST, pom.properties):
      # a CRLF working tree built by a non-Windows JVM
      run: |
        git config core.eol crlf
        git rm -rq --cached .
        git reset -q --hard
    - name: Set up Java 21
      uses: actions/setup-java@v2
      with:
        distribution: 'temurin'
        java-version: 21
    - name: Build
      # the public jars were built with JDK 21 (MANIFEST Build-Jdk-Spec: 21); the second
      # non-clean install reproduces the bundle plugin's Originally-Created-By header
      shell: bash
      run: |
        mvn -B -V install -pl logback-classic -am -Dmaven.test.skip.exec=true
        mvn -B -V install -pl logback-classic -am -Dmaven.test.skip.exec=true
    - uses: actions/upload-artifact@v4
      with:
        name: logback-classic-jars
        path: |
          logback-classic/target/logback-classic-1.3.16.jar
          logback-classic/target/logback-classic-1.3.16-tests.jar
        if-no-files-found: error


